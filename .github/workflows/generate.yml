name: Generated parser

on:
  push:
    branches: [main]
  pull_request:

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-package-lock && npm rebuild tree-sitter-cli
      - run: npx tree-sitter generate
      - name: Fail if the committed parser differs from grammar.js
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
