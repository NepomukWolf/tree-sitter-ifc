[package]
name = "tree-sitter-ifc"
description = "tree-sitter parser for IFC STEP files."
version = "0.1.1"
authors = ["Nepomuk Wolf"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "ifc"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/NepomukWolf/tree-sitter-ifc"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "compact/*",
  "tree-sitter.json",
  "/LICENSE",
  "README.md",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.3"
